[project]
name = "toolcryo"
version = "0.1.0"
description = "Self-supervised cryo-ET denoising using Equivariant Imaging (EI)"
readme = "README.md"
authors = [
    { name = "PHAN Triem", email = "triemphandinh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "mrcfile",
    "pyyaml",
    "submitit",
    "torch",
    # deepinv fork, branch `ddp-feature` (= bmalezieux/deepinv PR #5): 
    "deepinv @ git+https://github.com/bmalezieux/deepinv.git@9d3afce72f1cee2f68820e24a998a2ee60ec6ec5",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/toolcryo"]
